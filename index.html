        ];

        const cdlDefinitions = [
            { code: 'ECONOMIA', name: 'CdL Triennale in Economia', type: 'Triennale', years: [1, 2, 3], defaultColor: '#1e3a8a' },
            { code: 'SDS', name: 'CdL Triennale in Statistica per Data Science', type: 'Triennale', years: [1, 2, 3], defaultColor: '#047857' },
            { code: 'EIS', name: 'CdL Magistrale in Economia, Imprese e Sostenibilità', type: 'Magistrale', years: [1, 2], defaultColor: '#9a3412' },
            { code: 'DSSA', name: 'CdL Magistrale in Data Science per le Strategie Aziendali', type: 'Magistrale', years: [1, 2], defaultColor: '#6b21a8' },
            { code: 'FINANCE', name: 'CdL Magistrale in Finance and Insurance', type: 'Magistrale', years: [1, 2], defaultColor: '#831843' }
        ];

        const daysNumberMap = {
            '1': 'Lunedì',
            '2': 'Martedì',
            '3': 'Mercoledì',
            '4': 'Giovedì',
            '5': 'Venerdì',
            '6': 'Sabato'
        };

        const ROTATION_INTERVAL_MS = 25000;
        let currentScreenIndex = 0;
        let activeCdlList = [];
        let activeScrollTimers = [];
        let manualDaySelected = false;

        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
            setInterval(nextRotation, ROTATION_INTERVAL_MS);

            const daysMap = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
            const now = new Date();
            window.activeDay = daysMap[now.getDay()];
            filterDayLessons(window.activeDay);
        });

        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('it-IT');
            document.getElementById('live-date').innerText = now.toLocaleDateString('it-IT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            
            if (!manualDaySelected) {
                const daysMap = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
                const todayName = daysMap[now.getDay()];
                if (window.activeDay !== todayName) {
                    window.activeDay = todayName;
                    filterDayLessons(todayName);
                }
            }
        }

        function changeManualDay(val) {
            if (val === 'AUTO') {
                manualDaySelected = false;
                const daysMap = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
                const now = new Date();
                window.activeDay = daysMap[now.getDay()];
            } else {
                manualDaySelected = true;
                window.activeDay = daysNumberMap[val] || 'Lunedì';
            }
            filterDayLessons(window.activeDay);
        }

        function clearScrollTimers() {
            activeScrollTimers.forEach(t => clearInterval(t));
            activeScrollTimers = [];
        }

        function filterDayLessons(dayName) {
            document.getElementById('currentDayText').innerText = dayName.toUpperCase();
            const dayLessons = allLessons.filter(l => l.giorno && l.giorno.toLowerCase() === dayName.toLowerCase());
            
            activeCdlList = cdlDefinitions.map(cdl => {
                const cdlLessons = dayLessons.filter(l => l.cdl_code === cdl.code);
                return {
                    definition: cdl,
                    hasLessons: cdlLessons.length > 0,
                    lessons: cdlLessons
                };
            });
            currentScreenIndex = 0;
            renderCurrentScreen();
        }

        function renderCurrentScreen() {
            clearScrollTimers();
            const gridBox = document.getElementById('gridBox');
            gridBox.innerHTML = '';
            const cdlData = activeCdlList[currentScreenIndex];
            if (!cdlData) return;

            document.getElementById('pageBadge').innerText = `SCHERMATA ${currentScreenIndex + 1} DI ${activeCdlList.length}`;
            document.getElementById('cdlGroupBanner').innerText = `— ${cdlData.definition.name.toUpperCase()}`;

            const def = cdlData.definition;
            gridBox.className = `grid-container ${def.years.length === 3 ? 'grid-3-cols' : 'grid-2-cols'}`;

            def.years.forEach(yr => {
                const yrLessons = cdlData.lessons.filter(l => l.year_order === yr);
                
                const uniqueLessonsMap = new Map();
                yrLessons.forEach(l => {
                    const key = `${(l.orario||'').trim()}_${(l.materia||'').trim().toLowerCase()}_${(l.docente||'').trim().toLowerCase()}`;
                    if (!uniqueLessonsMap.has(key)) {
                        uniqueLessonsMap.set(key, l);
                    }
                });
                
                const uniqueLessonsList = Array.from(uniqueLessonsMap.values());
                uniqueLessonsList.sort((a, b) => (a.orario || '').localeCompare(b.orario || ''));

                const colEl = document.createElement('div');
                colEl.className = 'col-box';
                const sampleLesson = uniqueLessonsList[0] || allLessons.find(l => l.cdl_code === def.code && l.year_order === yr);
                const headerColor = sampleLesson ? sampleLesson.color : def.defaultColor;

                let bodyContent = '';
                if (uniqueLessonsList.length === 0) {
                    bodyContent = '';
                } else {
                    bodyContent = uniqueLessonsList.map(it => {
                        const gruppoTxt = it.gruppo ? ` (${it.gruppo})` : '';
                        const aulaTxt = it.aula ? it.aula : 'Aula TBD';
                        return `
                        <div class="card" style="border-left-color: ${headerColor};">
                            <div class="time">${it.orario}</div>
                            <div class="materia">${it.materia}${gruppoTxt}</div>
                            <div class="docente">${it.docente || 'Docente da definire'}</div>
                            <div class="foot">
                                <span class="aula" style="background-color: ${headerColor}; color: #ffffff;">${aulaTxt}</span>
                            </div>
                        </div>
                    `;
                    }).join('');
                }

                colEl.innerHTML = `
                    <div class="col-head" style="background-color: ${headerColor};">
                        ${yr}° ANNO - ${def.code}
                    </div>
                    <div class="col-body">
                        ${bodyContent}
                    </div>`;

                gridBox.appendChild(colEl);
            });

            setTimeout(startAutoScroll, 1000);
        }

        function startAutoScroll() {
            const columns = document.querySelectorAll('.col-body');
            columns.forEach(col => {
                const maxScroll = col.scrollHeight - col.clientHeight;
                if (maxScroll > 10) {
                    let direction = 1;
                    let pauseCounter = 40;

                    const timer = setInterval(() => {
                        if (pauseCounter > 0) {
                            pauseCounter--;
                            return;
                        }

                        col.scrollTop += direction * 1.5;

                        if (col.scrollTop >= maxScroll - 2) {
                            direction = -1;
                            pauseCounter = 60;
                        } else if (col.scrollTop <= 2) {
                            direction = 1;
                            pauseCounter = 60;
                        }
                    }, 40);

                    activeScrollTimers.push(timer);
                }
            });
        }

        function nextRotation() {
            if (activeCdlList.length > 1) {
                currentScreenIndex = (currentScreenIndex + 1) % activeCdlList.length;
                renderCurrentScreen();
            }
        }
    </script>
</body>
</html>
